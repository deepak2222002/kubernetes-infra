apiVersion: batch/v1
kind: Job

metadata:
  name: sql-init

spec:
  backoffLimit: 10

  template:
    metadata:
      name: sql-init

    spec:
      restartPolicy: OnFailure

      containers:
        - name: sql-init

          image: mcr.microsoft.com/mssql/server:2022-latest

          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sql-init-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql-init-secret
                  key: DB_PASSWORD

            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-sa-secret
                  key: MSSQL_SA_PASSWORD

          volumeMounts:
            - name: sql-init-script
              mountPath: /scripts

          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for SQL Server..."

              until /opt/mssql-tools18/bin/sqlcmd \
                -S sqlserver,1433 \
                -U sa \
                -P "$SA_PASSWORD" \
                -C \
                -Q "SELECT 1" > /dev/null 2>&1
              do
                sleep 5
              done

              echo "SQL Server is ready."

              /opt/mssql-tools18/bin/sqlcmd \
                -S sqlserver,1433 \
                -U sa \
                -P "$SA_PASSWORD" \
                -C \
                -Q "IF DB_ID('jobportal') IS NULL CREATE DATABASE jobportal"

              /opt/mssql-tools18/bin/sqlcmd \
                -S sqlserver,1433 \
                -U sa \
                -P "$SA_PASSWORD" \
                -C \
                -Q "IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = '$DB_USERNAME') CREATE LOGIN [$DB_USERNAME] WITH PASSWORD = '$DB_PASSWORD'"

              /opt/mssql-tools18/bin/sqlcmd \
                -S sqlserver,1433 \
                -U sa \
                -P "$SA_PASSWORD" \
                -C \
                -i /scripts/init.sql

              echo "SQL initialization completed."

          volumes:
            - name: sql-init-script
              configMap:
                name: sql-init-script